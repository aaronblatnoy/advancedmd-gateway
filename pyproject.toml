[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advancedmd-gateway"
version = "1.0.0"
description = "The only process that talks to AdvancedMD: one session, one rate clock, one tool surface."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
gateway = "gateway.tokens:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "domains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "domains"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
