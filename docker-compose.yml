# advancedmd-gateway, SPEC 21.
#
# ONE service, ONE replica. This is a correctness constraint, not a
# capacity choice: the rate clock and the AMD session are process-wide
# singletons (SPEC 4.6, 4.7). Never scale this service.
services:
  advancedmd-gateway:
    build: .
    image: advancedmd-gateway:1.0.0
    container_name: advancedmd-gateway
    restart: unless-stopped
    # SPEC 4.7 / 21: exactly one replica.
    deploy:
      replicas: 1
    ports:
      # Published on loopback by default. A bare "8820:8820" would bind
      # 0.0.0.0 on the host and expose the unauthenticated /health and
      # /metrics endpoints on every interface (SPEC 17.4). For a
      # production host, replace 127.0.0.1 with a private/VPN address.
      - "127.0.0.1:8820:8820"
    environment:
      AMD_USERNAME: ${AMD_USERNAME:?set AMD_USERNAME}
      AMD_PASSWORD: ${AMD_PASSWORD:?set AMD_PASSWORD}
      AMD_OFFICE_KEY: ${AMD_OFFICE_KEY:?set AMD_OFFICE_KEY}
      AMD_APP_NAME: ${AMD_APP_NAME:-TEMP}
      AMD_BASE_URL: ${AMD_BASE_URL:-}
      GATEWAY_TOKENS_PATH: ${GATEWAY_TOKENS_PATH:-/data/tokens.json}
      GATEWAY_PORT: ${GATEWAY_PORT:-8820}
      # Inside the container's own network namespace; the host-side publish
      # above is what limits exposure.
      GATEWAY_BIND: ${GATEWAY_BIND:-0.0.0.0}
      CLOCK_STATE_PATH: ${CLOCK_STATE_PATH:-/data/clock.json}
      CLOCK_MARGIN: ${CLOCK_MARGIN:-0.90}
      EXECUTION_ALLOWANCE_MS: ${EXECUTION_ALLOWANCE_MS:-120000}
      BATCH_AGING_MS: ${BATCH_AGING_MS:-60000}
      AMD_POST_TIMEOUT_S: ${AMD_POST_TIMEOUT_S:-30}
      LOGIN_CHECK_CACHE_S: ${LOGIN_CHECK_CACHE_S:-300}
      ENTRY_QUEUE_CAP: ${ENTRY_QUEUE_CAP:-2000}
      SHUTDOWN_DRAIN_S: ${SHUTDOWN_DRAIN_S:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WRITE_TOOLS_ENABLED: ${WRITE_TOOLS_ENABLED:-false}
      # SPEC 9.3 / 19. Stays false in production: a tool whose operator
      # live check is still pending returns tool_unverified. Set true only
      # to exercise the gateway before the live check is recorded.
      GATEWAY_SERVE_PENDING_VERIFICATION: ${GATEWAY_SERVE_PENDING_VERIFICATION:-false}
    volumes:
      - gateway-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8820/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(ok|degraded|starting)"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s

volumes:
  gateway-data:
