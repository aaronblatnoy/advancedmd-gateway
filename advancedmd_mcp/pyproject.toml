[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advancedmd-mcp"
version = "1.0.0"
description = "Local stdio MCP shim for advancedmd-gateway. Holds no credentials, no tool logic, no AdvancedMD knowledge."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
advancedmd-mcp = "advancedmd_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advancedmd_mcp"]
